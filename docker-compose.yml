version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: matrogulike_postgres
    environment:
      POSTGRES_DB: matrogulike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - matrogulike_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matrogulike_backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/matrogulike"
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - matrogulike_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  matrogulike_network:
    driver: bridge

